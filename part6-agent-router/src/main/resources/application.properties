quarkus.http.host=127.0.0.1
quarkus.http.port=18081
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=64K
quarkus.banner.enabled=false
%cli.quarkus.log.level=WARN

model.backend-name=primary
lab.directory=.

# Command modes use CDI and REST Client without claiming a backend HTTP port.
%cli.quarkus.http.host-enabled=false

quarkus.rest-client.model-gateway.url=http://127.0.0.1:1975
quarkus.rest-client.model-gateway.connect-timeout=1000
quarkus.rest-client.model-gateway.read-timeout=15000
quarkus.rest-client.model-gateway.disable-default-mapper=true
