quarkus.http.port=8082
quarkus.http.host=localhost

# CORS for A2A protocol and demo SPA
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,A2A-Version

# A2A agent URL (used in agent card)
agent.url=http://localhost:8082

# Single-user localhost lab: no identity provider is configured.
# A2A SDK 1.3+ otherwise denies all task operations without a TaskAuthorizationProvider.
# AGENTS.md operation rules and HITL gates remain enforced by WorkflowEngine.
a2a.authorization.required=false

# MCP client connection (Part 1 Quarkus MCP server)
quarkus.langchain4j.mcp.part1.transport-type=streamable-http
quarkus.langchain4j.mcp.part1.url=http://localhost:8080/mcp
