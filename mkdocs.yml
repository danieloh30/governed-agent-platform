site_name: Governed Enterprise Agent Platform
site_description: Build secure, observable, and continuously evaluated Java agent systems with MCP, A2A, Quarkus, and agentgateway.
site_url: https://danieloh30.github.io/governed-agent-platform/
repo_url: https://github.com/danieloh30/governed-agent-platform
repo_name: danieloh30/governed-agent-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Tutorials:
      - Learning path: tutorials/index.md
      - "1 · Governed MCP tools": tutorials/01-governed-mcp-tools.md
      - "2 · Gateway security": tutorials/02-agentgateway-security.md
      - "3 · Observability": tutorials/03-observability.md
      - "4 · Multi-agent governance": tutorials/04-multi-agent-governance.md
      - "5 · Evaluation": tutorials/05-evaluation.md
  - Enterprise:
      - Deep dives: enterprise/index.md
      - Production readiness: enterprise/production-readiness.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/render-mermaid.js
  - javascripts/repository-link.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/danieloh30/governed-agent-platform
      name: Governed Agent Platform on GitHub

copyright: Built as an open source tutorial for governed agent platforms.

strict: true
