# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Dev + guardrails configuration – no JWT, but ExtMCP guardrails enabled.
# Requires the ExtMCP guardrail server running on :9001.

config:
  adminAddr: localhost:15000

mcp:
  port: 3000
  policies:
    cors:
      allowOrigins:
        - "*"
      allowHeaders:
        - mcp-protocol-version
        - content-type
        - mcp-session-id
      exposeHeaders:
        - Mcp-Session-Id

    mcpGuardrails:
      processors:
        - kind: remote
          host: "localhost:9001"
          failureMode: failClosed
          methods:
            tools/call: request
            tools/list: response

  targets:
    - name: customer-tools
      mcp:
        host: http://localhost:8080/mcp
