name: Langfuse evaluation extension
on:
  push:
    branches: [main]
    paths: [part5-evaluation/langfuse/**, part5-evaluation/openenv/**, .github/workflows/langfuse.yml]
  pull_request:
    paths: [part5-evaluation/langfuse/**, part5-evaluation/openenv/**, .github/workflows/langfuse.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluator-and-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            part5-evaluation/langfuse/requirements.txt
            part5-evaluation/openenv/requirements.txt
      - run: python -m pip install -r part5-evaluation/langfuse/requirements.txt
      - run: python -m unittest discover -s part5-evaluation/langfuse -v
      - run: python part5-evaluation/langfuse/smoke.py
