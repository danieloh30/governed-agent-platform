name: Agent Router lab

on:
  push:
    branches: [main]
    paths:
      - part6-agent-router/**
      - pom.xml
      - .github/workflows/agent-router.yml
  pull_request:
    paths:
      - part6-agent-router/**
      - pom.xml
      - .github/workflows/agent-router.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Check script syntax
        run: |
          bash -n part6-agent-router/install.sh part6-agent-router/start-all.sh part6-agent-router/smoke.sh
      - name: Build and test Quarkus backends
        run: mvn --batch-mode --no-transfer-progress -pl part6-agent-router -am verify
      - name: Install pinned Agent Router
        run: ./part6-agent-router/install.sh
      - name: Verify routing, failover, and recovery
        run: ./part6-agent-router/start-all.sh --smoke
        env:
          SKIP_BUILD: "true"
      - name: Upload gateway diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: agent-router-log
          path: part6-agent-router/.runtime/*.log
          include-hidden-files: true
          if-no-files-found: ignore
