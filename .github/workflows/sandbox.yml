name: OpenSandbox integration

on:
  push:
    branches: [main]
    paths: ['part7-opensandbox/**', 'pom.xml', '.github/workflows/sandbox.yml']
  pull_request:
    paths: ['part7-opensandbox/**', 'pom.xml', '.github/workflows/sandbox.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test Quarkus service
        run: mvn --batch-mode --no-transfer-progress -pl part7-opensandbox -am package
      - name: Start real OpenSandbox runtime
        run: ./part7-opensandbox/sandbox.sh up
      - name: Verify execution through MCP and REST
        run: |
          java -jar part7-opensandbox/target/quarkus-app/quarkus-run.jar > /tmp/part7-quarkus.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          python3 part7-opensandbox/smoke.py --evidence-dir /tmp/part7-evidence
      - name: Runtime diagnostics
        if: failure()
        run: |
          docker logs governed-part7-opensandbox || true
          cat /tmp/part7-quarkus.log || true
      - name: Delete workloads and stop runtime
        if: always()
        run: ./part7-opensandbox/sandbox.sh down
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sandbox-evidence
          path: /tmp/part7-evidence
          if-no-files-found: ignore
