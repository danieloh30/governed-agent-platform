name: OpenEnv behavioral lab

on:
  push:
    branches: [main]
    paths:
      - part5-evaluation/openenv/**
      - .github/workflows/openenv.yml
  pull_request:
    paths:
      - part5-evaluation/openenv/**
      - .github/workflows/openenv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavioral-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: part5-evaluation/openenv/requirements.txt
      - name: Install pinned OpenEnv runtime
        run: python -m pip install -r part5-evaluation/openenv/requirements.txt
      - name: Check approval invariants and negative controls
        run: python -m unittest discover -s part5-evaluation/openenv -v
      - name: Check real OpenEnv sessions and evaluation facade
        run: python part5-evaluation/openenv/smoke.py
