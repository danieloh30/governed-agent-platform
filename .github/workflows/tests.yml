name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Build evaluation services
        run: mvn --batch-mode --no-transfer-progress -pl part1-quarkus-mcp,part5-evaluation -am package -DskipTests

      - name: Verify golden suites against the MCP server
        run: python3 part5-evaluation/smoke.py
