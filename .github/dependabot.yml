version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
      mcp-server:
        patterns:
          - "io.quarkiverse.mcp*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
