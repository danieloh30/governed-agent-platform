<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quarkus MCP Server</title>
<style>
:root {
  color-scheme: light;
  --surface: #f9f9f7;
  --card: #fcfcfb;
  --text: #0b0b0b;
  --muted: #898781;
  --secondary: #52514e;
  --border: rgba(11,11,11,0.10);
  --gridline: #e1e0d9;
  --accent: #2a78d6;
  --good: #0ca30c;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #0d0d0d;
    --card: #1a1a19;
    --text: #ffffff;
    --muted: #898781;
    --secondary: #c3c2b7;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
    --accent: #3987e5;
    --good: #0ca30c;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface); color: var(--text);
  line-height: 1.5; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.shell { max-width: 640px; width: 100%; padding: 32px 24px; }
header { margin-bottom: 32px; }
header h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
header p { font-size: 0.85rem; color: var(--muted); }
.status-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 24px; font-size: 0.85rem;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--good); flex-shrink: 0;
}
.dot.pending { background: var(--muted); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px; margin-bottom: 16px;
}
.card h2 { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; }
.tool-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0; border-bottom: 1px solid var(--gridline);
  font-size: 0.85rem;
}
.tool-row:last-child { border-bottom: none; }
.tool-name {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  font-weight: 500;
}
.tool-desc { color: var(--muted); font-size: 0.8rem; text-align: right; }
.link-row {
  display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;
}
.link-row a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 6px; font-size: 0.85rem;
  font-weight: 500; text-decoration: none; transition: opacity 0.15s;
}
.link-row a:hover { opacity: 0.85; }
.link-primary { background: var(--accent); color: #fff; }
.link-secondary {
  background: transparent; color: var(--accent);
  border: 1px solid var(--accent);
}
#info { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Quarkus MCP Server</h1>
    <p>Model Context Protocol tool service for AI agents</p>
  </header>

  <div class="status-row">
    <span class="dot pending" id="dot"></span>
    <span id="status">Connecting...</span>
  </div>

  <div class="card">
    <h2>Registered tools</h2>
    <div id="tools"><p style="font-size:0.85rem;color:var(--muted)">Loading...</p></div>
  </div>

  <div class="card">
    <h2>MCP endpoint</h2>
    <p style="font-size:0.85rem;color:var(--secondary)">
      <code style="font-size:0.85rem">POST /mcp</code> &mdash;
      JSON-RPC over Streamable HTTP
    </p>
    <p id="info" style="margin-top:8px"></p>
  </div>

  <div class="link-row" id="links" style="display:none">
    <a href="http://localhost:8887/index.html" class="link-primary">Open MCP Console Demo</a>
    <a href="/q/dev-ui" class="link-secondary">Quarkus Dev UI</a>
  </div>
</div>

<script>
async function init() {
  try {
    const res = await fetch('/mcp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' },
      body: JSON.stringify({
        jsonrpc: '2.0', id: 1, method: 'initialize',
        params: { protocolVersion: '2025-03-26', capabilities: {},
                  clientInfo: { name: 'server-info', version: '1.0' } }
      })
    });
    const data = await res.json();
    const info = data.result || {};
    const name = info.serverInfo?.name || 'unknown';
    const version = info.serverInfo?.version || '';

    document.getElementById('dot').className = 'dot';
    document.getElementById('status').textContent = `${name} v${version} — ready`;
    document.getElementById('info').textContent =
      `Protocol ${info.protocolVersion || 'unknown'} · Server: ${name} ${version}`;

    const toolsRes = await fetch('/mcp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} })
    });
    const toolsData = await toolsRes.json();
    const tools = toolsData.result?.tools || [];

    const c = document.getElementById('tools');
    if (tools.length === 0) {
      c.innerHTML = '<p style="font-size:0.85rem;color:var(--muted)">No tools registered</p>';
    } else {
      c.innerHTML = tools.map(t =>
        `<div class="tool-row"><span class="tool-name">${esc(t.name)}</span><span class="tool-desc">${esc(shorten(t.description, 40))}</span></div>`
      ).join('');
    }

    document.getElementById('links').style.display = 'flex';
  } catch {
    document.getElementById('status').textContent = 'Could not reach MCP endpoint';
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function shorten(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : s || ''; }

init();
</script>
</body>
</html>
