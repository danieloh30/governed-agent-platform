# Adapted from langfuse/langfuse v4.71.0 docker-compose.yml.
# Only the web UI is published. stack.py generates private local credentials.
services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4.71.0
    depends_on: &dependencies
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: &shared
        DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Use stack.py up}@postgres:5432/postgres
        SALT: ${SALT:?Use stack.py up}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Use stack.py up}
        NEXTAUTH_URL: http://localhost:3000
        TELEMETRY_ENABLED: "false"
        CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
        CLICKHOUSE_URL: http://clickhouse:8123
        CLICKHOUSE_USER: clickhouse
        CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Use stack.py up}
        CLICKHOUSE_CLUSTER_ENABLED: "false"
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_AUTH: ${REDIS_AUTH:?Use stack.py up}
        LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
        LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
        LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
        LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
        LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Use stack.py up}
        LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
        LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
        LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
        LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
        LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
        LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Use stack.py up}
        LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
        LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Use stack.py up}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: acme-evaluation
      LANGFUSE_INIT_ORG_NAME: Acme Evaluation Lab
      LANGFUSE_INIT_PROJECT_ID: acme-goose
      LANGFUSE_INIT_PROJECT_NAME: Goose Refund Experiments
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Use stack.py up}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Use stack.py up}
      LANGFUSE_INIT_USER_EMAIL: demo@acme.invalid
      LANGFUSE_INIT_USER_NAME: Demo Operator
      LANGFUSE_INIT_USER_PASSWORD: ${DEMO_PASSWORD:?Use stack.py up}
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.71.0
    depends_on: *dependencies
    environment:
      <<: *shared
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  postgres:
    image: docker.io/postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use stack.py up}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: docker.io/redis:7.2.11
    command: [redis-server, --requirepass, "${REDIS_AUTH:?Use stack.py up}", --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_AUTH}" ping | grep PONG']
      interval: 3s
      timeout: 3s
      retries: 30
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?Use stack.py up}
    volumes: [redis_data:/data]
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Use stack.py up}
    volumes: [clickhouse_data:/var/lib/clickhouse, clickhouse_logs:/var/log/clickhouse-server]
    healthcheck:
      test: [CMD-SHELL, wget --no-verbose --tries=1 --spider http://localhost:8123/ping]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: cgr.dev/chainguard/minio@sha256:906f6ab6bf4755a0661acf5a51d1fc2497e6093fa93b6d47fbafb557946824be
    entrypoint: /usr/bin/minio
    command: [server, --address, ":9000", /data]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Use stack.py up}
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 5s
      retries: 30
  bucket:
    image: cgr.dev/chainguard/minio@sha256:906f6ab6bf4755a0661acf5a51d1fc2497e6093fa93b6d47fbafb557946824be
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: /usr/bin/mc
    command: [mb, --ignore-existing, local/langfuse]
    environment:
      MC_HOST_local: http://minio:${MINIO_ROOT_PASSWORD:?Use stack.py up}@minio:9000
volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
